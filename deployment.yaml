
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agilebanking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agilebanking
  template:
    metadata:
      labels:
        app: agilebanking
    spec:
      containers:
        - name: agilebanking
          image: YOUR_DOCKERHUB_USERNAME/agilebanking:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: agilebanking-service
spec:
  type: NodePort
  selector:
    app: agilebanking
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30007
